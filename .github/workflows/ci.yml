name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install check dependencies
        run: |
          python -m pip install -r software/requirements.txt
          python -m pip install ruff==0.13.2
      - name: Check Python and JavaScript
        run: |
          python -m ruff check data software --select E9,F63,F7,F82
          git ls-files -z '*.js' '*.cjs' | xargs -0 -r -n 1 node --check
      - name: Restore public weather inputs
        id: weather
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/raw
          key: weather-boston-2023-v1-${{ hashFiles('data/README.md', 'data/build_solar_2023.py', 'software/h1/build.py') }}
      - name: Download public weather inputs
        if: steps.weather.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/raw/nasa-power data/raw/isd-rain
          curl --fail --location --retry 3 --max-time 180 \
            'https://power.larc.nasa.gov/api/temporal/hourly/point?parameters=ALLSKY_SFC_SW_DWN,ALLSKY_SFC_SW_DNI,ALLSKY_SFC_SW_DIFF,T2M,PRECTOTCORR&community=RE&longitude=-71.00975&latitude=42.36057&start=20230101&end=20231231&format=CSV&time-standard=UTC' \
            -o data/raw/nasa-power/power-hourly-boston-logan-2023.csv
          curl --fail --location --retry 3 --max-time 180 \
            'https://www.ncei.noaa.gov/data/global-hourly/access/2023/72509014739.csv' \
            -o data/raw/isd-rain/72509014739-2023.csv
      - name: Verify weather snapshots
        run: |
          echo '9d6310e79a7986e7bee10fcea8d71494b7b842ce659dd97be107e0acdbb355e3  data/raw/nasa-power/power-hourly-boston-logan-2023.csv' | sha256sum --check
          echo '2654aba24fe8fe2ad2ad36686346f92d9dc812caf507a53ec2e94638aacbccd9  data/raw/isd-rain/72509014739-2023.csv' | sha256sum --check
      - name: Run Python tests including offline builds
        run: python -m pytest software/tests -q
      - name: Run watering controller tests when present
        if: hashFiles('software/tests/*.test.cjs') != ''
        run: node --test software/tests/*.test.cjs
