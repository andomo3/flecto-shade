name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: software/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install check dependencies
        run: |
          python -m pip install -r software/requirements.txt
          python -m pip install ruff==0.13.2
      - name: Check Python and JavaScript
        run: |
          python -m ruff check data software --select E9,F63,F7,F82
          git ls-files -z '*.js' '*.cjs' | xargs -0 -r -n 1 node --check
      - name: Restore public weather inputs
        id: weather
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/raw
          key: weather-2023-v1-${{ hashFiles('data/README.md', 'data/build_solar_2023.py', 'software/h1/build.py') }}
      - name: Download public weather inputs
        if: steps.weather.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/raw/nasa-power data/raw/isd-rain
          curl --fail --location --retry 3 --max-time 180 \
            'https://power.larc.nasa.gov/api/temporal/hourly/point?parameters=ALLSKY_SFC_SW_DWN,ALLSKY_SFC_SW_DNI,ALLSKY_SFC_SW_DIFF,T2M,PRECTOTCORR&community=RE&longitude=-81.33544&latitude=28.54653&start=20230101&end=20231231&format=CSV&time-standard=UTC' \
            -o data/raw/nasa-power/power-hourly-orlando-executive-2023.csv
          curl --fail --location --retry 3 --max-time 180 \
            'https://www.ncei.noaa.gov/data/global-hourly/access/2023/72205312841.csv' \
            -o data/raw/isd-rain/72205312841-2023.csv
      - name: Verify weather snapshots
        run: |
          echo 'c81490d249cb1fc857b0edf44c54d6fcdbc7c1e5b30b326310138a10f25cefc4  data/raw/nasa-power/power-hourly-orlando-executive-2023.csv' | sha256sum --check
          echo 'd26366ed5b470b8a79d0c447b08b693b7b77f810bc8ee7a138c1a75682c64f08  data/raw/isd-rain/72205312841-2023.csv' | sha256sum --check
      - name: Run Python tests including offline builds
        run: python -m pytest software/tests -q
      - name: Run watering controller tests when present
        if: hashFiles('software/tests/*.test.cjs') != ''
        run: node --test software/tests/*.test.cjs
      - name: Package static demo
        run: git archive --format=zip --output=flecto-shade-static.zip HEAD:software/page '*.html' '*.css' '*.js' '*.json' '*.svg' .vercelignore
      - name: Upload deployable static demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flecto-shade-static
          path: flecto-shade-static.zip
          if-no-files-found: error
          retention-days: 14
