<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shade house weather replay — Apopka, Florida</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="console">
  <p><a href="index.html">Open farmer-selected watering</a></p>
  <section class="hero" aria-labelledby="page-title">
    <figure class="model" id="figure-slot" data-slot="shade-house">
      <div class="model-frame" id="model-frame">
        <div class="model-viewport" id="roof" aria-live="off"></div>
        <canvas class="rain-canvas" id="rain-canvas" aria-hidden="true"></canvas>
        <div class="cad-region-labels" aria-label="CAD roof regions from left to right">
          <span data-zone="D">D</span><span data-zone="C">C</span>
          <span data-zone="B">B</span><span data-zone="A">A</span>
        </div>
        <div class="model-identity">
          <div class="identity-line"><span class="status-dot" aria-hidden="true"></span><span>Simulated roof</span></div>
          <h1 id="page-title">Shade house rain control</h1>
          <p id="place">Loading the day</p>
        </div>
        <div class="playback-panel">
          <div class="weather-now">
            <span class="clock-time" id="clock">--:--</span>
            <span class="rain-now" id="rain-status">Loading weather</span>
          </div>
          <div class="playback-actions">
            <button type="button" class="btn-secondary" id="reset" hidden>Reset choices</button>
            <button type="button" class="btn" id="play" disabled><span id="play-label">Play the day</span></button>
          </div>
        </div>
        <aside class="rain-plan" aria-labelledby="rain-plan-title">
          <div class="rain-plan-head">
            <h2 id="rain-plan-title">Rain access</h2>
            <p>Choose which roof regions may open when rain reaches the house.</p>
          </div>
          <div class="region-controls" id="region-controls"></div>
        </aside>
        <button type="button" class="view-reset" id="reset-view" aria-label="Reset the roof to bird's-eye view">Bird's-eye</button>
        <p class="camera-help">Drag to orbit · Scroll to zoom</p>
      </div>
      <div class="timeline">
        <label for="time-control">Time of day</label>
        <input type="range" id="time-control" min="0" max="23" step="1" value="0">
        <div class="timeline-meta">
          <span id="date">&nbsp;</span>
          <span id="weather-readout">Sun -- · Rain -- · Air --</span>
        </div>
      </div>
      <figcaption>
        <span class="cap-lead">Four independently controlled regions in the team's CAD.</span>
        Regions A–C use the crop simulation; Region D is a manual bay with no crop figures attached.
        During rain, only regions allowed by the grower can lift their fins.
        <span class="cap-pending">Geometry is modelled and not built. Mechanism inspiration: ITKE Flectofin, patent EP2320015.</span>
      </figcaption>
    </figure>
  </section>
  <section class="zones-wrap" aria-labelledby="zones-title">
    <div class="section-heading">
      <div><h2 id="zones-title">What each crop receives</h2><p>Three crop zones and one manual roof region respond independently.</p></div>
      <span class="sim-label">Simulated</span>
    </div>
    <div class="zones" id="zones" aria-label="Roof regions"></div>
  </section>
</main>
<footer class="foot">
  <p class="foot-region" id="foot-region"></p>
  <p class="foot-src" id="sources"></p>
  <p class="foot-src" id="credit"></p>
  <p class="foot-honest">Every figure is modelled except the source rain-gauge data. The roof, zones and crops are simulated; no shade-house instrument produced these outputs.</p>
</footer>
<script src="app.js"></script>
</body>
</html>
